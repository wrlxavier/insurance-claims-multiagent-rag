[project]
name = "insurance-claims-multiagent-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyarrow>=14",
    "pymupdf>=1.24",
    "pypdf>=6.14.2",
    "pytesseract>=0.3.13",
    "pillow>=12.3.0",
    "langchain-core>=1.5.5",
    "langchain-openai>=1.5.1",
    "python-dotenv>=1.2.2",
    "tqdm>=4.67",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "langchain-anthropic>=0.3",
    "mypy>=2.3.0",
    "nbstripout>=0.9.1",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: fast tests with no external dependencies",
    "integration: tests requiring Postgres or other real infra",
    "eval: evaluation/benchmark runs against the golden set",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["app/src"]
force-exclude = true
exclude = [
    ".venv",
    "build",
    "dist",
    "__pypackages__",
    "__pycache__",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".ai_context",
    "notebooks/scratch/",
    # "__init__.py",  # it will be excluded via per-file-ignores
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "I",  # isort
    "N",  # pep8-naming
    "D",  # pydocstyle
    # "S",   # flake8-bandit
    # "T20", # flake8-print
    # "PT",  # flake8-pytest-style
    # "ANN", # missing type annotations
    # "ARG", # argument type issues
]

# Ignore specific rules
ignore = [
    # "E501", # line too long
    # "B008", # do not perform function calls in argument defaults
]

# Allow fixing specific rules
fixable = ["ALL"]
unfixable = []

# Docstrings style
[tool.ruff.lint.pydocstyle]
convention = "google" # or "numpy", "pep257"

# Common pragmatic exceptions in bootstrap:
[tool.ruff.lint.per-file-ignores]
"app/src/**/__init__.py" = ["D104"] # package without docstring
"tests/**" = ["D"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Use trailing commas
skip-magic-trailing-comma = false
# Auto-detect line ending
line-ending = "auto"

[tool.mypy]
files = ["app/src", "tests", "scripts"]
mypy_path = "app/src"
exclude = ["build/", "notebooks/scratch/"]
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "fitz.*",
    "pyarrow.*",
    "pytesseract.*",
    "langchain_core.*",
    "langchain_anthropic.*",
    "tqdm.*",
]
ignore_missing_imports = true

# scripts/draft_golden_questions_casco.py and
# scripts/finalize_golden_set_from_review.py import these sibling script
# modules by bare name (matching how `python scripts/<name>.py` resolves
# them at runtime -- see each script's import block) rather than via the
# `scripts.` package path tests use; mypy has no path-based sibling-import
# resolution, so this only silences that path mismatch. Both modules are
# still fully type-checked in their own right via the `scripts` entry in
# [tool.mypy]'s `files` above.
[[tool.mypy.overrides]]
module = [
    "adversarial_clause_selection",
    "casco_clause_selection",
    "find_candidate_clauses",
    "validate_golden_set",
    "pii_safety_net",
    "synthetic_claims_selection",
    "validate_synthetic_claims",
    "product_claim_mismatch_selection",
    "unanswerable_question_selection",
    "validate_product_claim_mismatch",
]
ignore_missing_imports = true
