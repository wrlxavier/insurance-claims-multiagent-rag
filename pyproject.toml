[project]
name = "insurance-claims-multiagent-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyarrow>=14",
    "pymupdf>=1.24",
    "pypdf>=6.14.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: fast tests with no external dependencies",
    "integration: tests requiring Postgres or other real infra",
    "eval: evaluation/benchmark runs against the golden set",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["app/src"]
force-exclude = true
exclude = [
    ".venv",
    "build",
    "dist",
    "__pypackages__",
    "__pycache__",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".ai_context",
    # "__init__.py",  # it will be excluded via per-file-ignores
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "I",  # isort
    "N",  # pep8-naming
    "D",  # pydocstyle
    # "S",   # flake8-bandit
    # "T20", # flake8-print
    # "PT",  # flake8-pytest-style
    # "ANN", # missing type annotations
    # "ARG", # argument type issues
]

# Ignore specific rules
ignore = [
    # "E501", # line too long
    # "B008", # do not perform function calls in argument defaults
]

# Allow fixing specific rules
fixable = ["ALL"]
unfixable = []

# Docstrings style
[tool.ruff.lint.pydocstyle]
convention = "google" # or "numpy", "pep257"

# Common pragmatic exceptions in bootstrap:
[tool.ruff.lint.per-file-ignores]
"app/src/**/__init__.py" = ["D104"] # package without docstring
"tests/**" = ["D"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Use trailing commas
skip-magic-trailing-comma = false
# Auto-detect line ending
line-ending = "auto"

[tool.mypy]
files = ["app/src", "tests", "scripts"]
exclude = ["build/"]
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fitz", "pyarrow", "pyarrow.parquet"]
ignore_missing_imports = true
