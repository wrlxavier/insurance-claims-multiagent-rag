repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        args: ["--config-file=pyproject.toml"]
        additional_dependencies:
          # - fastapi>=0.128.0
          - pydantic>=2.12.5
          - pydantic-settings>=2.12.0
          - pytest>=9.1.1
          - pypdf>=6.14.2
          - pillow>=12.3.0
          - langchain-core>=1.5.5
          - langchain-openai>=1.5.1
          - langchain-anthropic>=0.3
          - langgraph>=1.2
          # [M4-09]: infrastructure/graph/checkpointer.py imports both
          # directly (PostgresSaver, and psycopg for the connection).
          - langgraph-checkpoint-postgres>=3.1.2
          - psycopg>=3.3.4
          - sqlalchemy>=2.0.52
          - alembic>=1.19.1
          - pgvector>=0.5.0
          - tokenizers>=0.20
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout