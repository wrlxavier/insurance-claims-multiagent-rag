# Local infrastructure for development, integration tests, and the full
# containerised assessment stack.
#
# [M0-08] brought up the database. [M5-05] adds `redis` -- the asynchronous
# assessment queue (`make worker`) needs it, and so does `make test-integration`.
# [M5-07] adds the self-hosted Langfuse stack behind the `tracing` profile:
# `docker compose --profile tracing up -d` is the traced stack, a plain `up`
# never starts it. [M5-09] adds `migrate` / `api` / `worker` -- one shared
# image (the repo's `Dockerfile`), reused via the `&app-build` /
# `&app-environment` anchors below -- so a plain `docker compose up -d --build`
# now starts the full assessment stack (postgres, redis, migrate, api,
# worker); see README's Quickstart for the step order `api`/`worker` need.
# Every block reads its configuration from the same `${...}` variables those
# services also read, so they are appended, not rewritten.
services:
  postgres:
    # Postgres major and pgvector version are both explicit: the floating
    # `pg17` tag would let a pgvector upgrade in and silently change index
    # behaviour. See docs/DATABASE.md for the minimum version this project
    # requires and why.
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-insurance_claims}
    ports:
      # `make migrate` and pytest run on the host, not inside the network.
      - ${DATABASE_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-insurance_claims}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    # Pinned major like postgres above. The queue is transient work state, not a
    # store of record: persistence is disabled so a restart is a clean slate.
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      # `make worker` and pytest connect from the host.
      - ${REDIS_PORT:-6379}:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ---------------------------------------------------------------------------
  # Assessment service -- [M5-09]. `api` and `worker` share one image (this
  # repo's Dockerfile) and one environment shape; `migrate` uses the same
  # image to apply Alembic and the LangGraph checkpointer's own setup once,
  # before either starts -- `build_core_components()` probes the checkpointer
  # at API startup and errors on a missing schema, so `depends_on: postgres
  # (healthy)` alone is not enough ordering. All three load `.env` directly
  # (`env_file`) and override only the keys that mean something different
  # from inside the compose network than from the host: `postgres`/`redis`
  # instead of `localhost`, and the in-network Langfuse hostname (inert
  # unless the `tracing` profile is also up). See docs/DEPLOYMENT.md.
  # ---------------------------------------------------------------------------
  migrate:
    build: &app-build
      context: .
      dockerfile: Dockerfile
    image: insurance-claims-assessment:local
    env_file: .env
    environment: &app-environment
      DATABASE_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      LANGFUSE_HOST: http://langfuse-web:3000
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.setup_checkpointer"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *app-build
    image: insurance-claims-assessment:local
    env_file: .env
    environment: *app-environment
    ports:
      - ${API_PORT:-8000}:8000
    volumes: &app-volumes
      - hf_cache:/root/.cache/huggingface
      # `retriever_factory.load_retriever_components()` reads
      # build/parsed_clauses.jsonl and build/chunks.jsonl directly at startup
      # (the BM25 lexical leg and the exclusion-clause graph are in-process,
      # not Postgres -- docs/LEXICAL_RETRIEVAL.md). Bind-mounted, not baked
      # into the image, so a re-`make build-index` on the host is picked up
      # by a container restart, no image rebuild. See docs/DEPLOYMENT.md.
      - ./build:/app/build:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # Liveness, not `/ready`: `/ready` 503s until the vector index is
      # populated (`make build-index`), which would otherwise leave a
      # freshly-started demo stack "unhealthy" forever.
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build: *app-build
    image: insurance-claims-assessment:local
    env_file: .env
    environment: *app-environment
    command: ["python", "-m", "scripts.run_assessment_worker"]
    volumes: *app-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # No HTTP surface -- liveness is "the worker pool process is running".
      test: ["CMD-SHELL", "pgrep -f scripts.run_assessment_worker || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Tracing -- [M5-07]. `profiles: ["tracing"]` on every service below, so a
  # plain `docker compose up -d` never starts them: tracing is opt-in at the
  # infrastructure layer the same way `TRACING_ENABLED` makes it opt-in at the
  # application layer.
  #
  #   docker compose --profile tracing up -d
  #
  # Langfuse v4 needs Postgres, ClickHouse, S3-compatible blob storage and Redis.
  # It shares this stack's postgres (its own database) and redis (its own db
  # index) rather than duplicating them; ClickHouse and MinIO have no local
  # counterpart, so they are added, unpublished -- nothing outside the compose
  # network talks to them.
  #
  # Note the variable names: the langfuse containers read `DATABASE_URL`, `SALT`
  # and `ENCRYPTION_KEY`, and `DATABASE_URL` already means the *application*
  # database in this project's .env. Every value below is therefore passed
  # explicitly, and our own knobs stay under the `LANGFUSE_` prefix.
  # ---------------------------------------------------------------------------
  clickhouse:
    # Langfuse's trace store. Pinned to the minor Langfuse tests against, for the
    # same reason postgres and redis are pinned above.
    image: clickhouse/clickhouse-server:25.12
    profiles: ["tracing"]
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-clickhouse}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test:
        ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    # Langfuse uploads raw ingestion events to blob storage before the worker
    # folds them into ClickHouse. The bucket is created by the entrypoint rather
    # than by a separate init container, as upstream's own compose does.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["tracing"]
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" /data'
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD:-miniosecret}
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  langfuse-worker: &langfuse-service
    image: docker.langfuse.com/langfuse/langfuse-worker:4.28.1
    profiles: ["tracing"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: &langfuse-env
      # Its own database on this stack's postgres -- created by
      # docker/postgres/initdb/02-create-langfuse-database.sql on a fresh volume.
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${LANGFUSE_DB_NAME:-langfuse}
      # db index 1: the assessment queue owns db 0, so RQ's keyspace and
      # Langfuse's BullMQ queues never share a `FLUSHDB`.
      REDIS_CONNECTION_STRING: redis://redis:6379/1
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:-miniosecret}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:-miniosecret}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3000}
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT in .env -- openssl rand -hex 32}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in .env -- openssl rand -hex 32}
      # This is a local development stack; it phones nobody home.
      TELEMETRY_ENABLED: "false"
    healthcheck:
      # `$$(hostname)`, not localhost: both langfuse servers bind the container's
      # own network address rather than loopback, so a probe at 127.0.0.1 (or at
      # `localhost`, which resolves to ::1 here) is refused by a healthy service.
      # The `$$` is compose escaping -- the shell inside the container expands it.
      test:
        ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://$$(hostname):3030/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  langfuse-web:
    <<: *langfuse-service
    image: docker.langfuse.com/langfuse/langfuse:4.28.1
    ports:
      - ${LANGFUSE_PORT:-3000}:3000
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET in .env -- openssl rand -hex 32}
      # Headless bootstrap: the project is created on first boot with exactly the
      # keys the application is already configured with, so `up -d` yields a
      # working tracer with no click-through in the UI.
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-insurance-claims}
      LANGFUSE_INIT_ORG_NAME: Insurance Claims
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-claims-assessment}
      LANGFUSE_INIT_PROJECT_NAME: Claims Assessment
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?set LANGFUSE_PUBLIC_KEY in .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?set LANGFUSE_SECRET_KEY in .env}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: Local Analyst
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    healthcheck:
      test:
        ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://$$(hostname):3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
  # Persists the ~1.2GB embedder/reranker model download (docs/EMBEDDINGS.md,
  # docs/RERANKING.md) across `api`/`worker` restarts.
  hf_cache:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
