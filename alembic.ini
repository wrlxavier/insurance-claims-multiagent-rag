[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Migration file naming: YYYYMMDD_NN_<slug>.py, with the revision id set to
# the matching YYYYMMDD_NN. Documented in docs/DATABASE.md.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Resolved by alembic/env.py from the [M0-03] settings loader -- left empty
# here so there is exactly one source of truth for the database URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
